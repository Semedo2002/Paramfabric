apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "paramfabric.fullname" . }}
  labels:
    app.kubernetes.io/name: paramfabric
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: paramfabric
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: paramfabric
        app.kubernetes.io/component: api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["uvicorn", "paramfabric.server.app:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers"]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: {{ include "paramfabric.fullname" . }}-config
          env:
            {{- include "paramfabric.secretEnv" . | nindent 12 }}
          volumeMounts:
            {{- include "paramfabric.volumeMounts" . | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        {{- include "paramfabric.volumes" . | nindent 8 }}
