{{- if .Values.worker.enabled }}
{{- if not .Values.redis.enabled }}
{{- fail "worker.enabled requires redis.enabled (workers drain the Redis task queue)" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "paramfabric.fullname" . }}-worker
  labels:
    app.kubernetes.io/name: paramfabric
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: paramfabric
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: paramfabric
        app.kubernetes.io/component: worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      terminationGracePeriodSeconds: 120
      containers:
        - name: worker
          image: "{{ .Values.worker.image.repository | default .Values.image.repository }}:{{ .Values.worker.image.tag | default .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["paramfabric", "worker"]
          envFrom:
            - configMapRef:
                name: {{ include "paramfabric.fullname" . }}-config
          env:
            {{- include "paramfabric.secretEnv" . | nindent 12 }}
          volumeMounts:
            {{- include "paramfabric.volumeMounts" . | nindent 12 }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
      volumes:
        {{- include "paramfabric.volumes" . | nindent 8 }}
{{- end }}
